
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

<main class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <div class="app-logo">✓</div>
            <h1>Создать аккаунт</h1>
            <p>Зарегистрируйтесь, чтобы управлять своими задачами</p>
        </div>

        <div th:if="${registrationError}"
             class="alert alert-error"
             role="alert"
             th:text="${registrationError}">
        </div>

        <div th:if="${errors}" class="alert alert-error" role="alert">
            <ul class="validation-list">
                <li th:each="error : ${errors}"
                    th:text="${error.defaultMessage}">
                </li>
            </ul>
        </div>

        <form th:action="@{/register}" method="post" class="auth-form">

            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Придумайте логин"
                       autocomplete="username"
                       minlength="3"
                       maxlength="30"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="example@mail.com"
                       autocomplete="email"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Не менее 8 символов"
                       autocomplete="new-password"
                       minlength="8"
                       maxlength="72"
                       required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Зарегистрироваться
            </button>

        </form>

        <p class="auth-footer">
            Уже есть аккаунт?
            <a th:href="@{/login}">Войти</a>
        </p>

    </div>
</main>

</body>
</html>
