
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая задача — Task Manager</title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="dashboard-page">

<header class="dashboard-header">
    <div class="dashboard-header-inner">
        <a class="brand" th:href="@{/tasks}">
            <span class="brand-icon">✓</span>
            <span>Task Manager</span>
        </a>
    </div>
</header>

<main class="form-page-container">

    <div class="form-page-heading">
        <a th:href="@{/tasks}" class="form-back-link">
            ← Вернуться к списку задач
        </a>

        <h1>Создать задачу</h1>
        <p>Заполните информацию о новой задаче</p>
    </div>

    <section class="task-form-card">

        <form id="task-form">

            <div id="form-error"
                 class="page-error"
                 role="alert"
                 hidden></div>

            <div class="form-group">
                <label for="title">Название задачи</label>
                <input id="title"
                       type="text"
                       placeholder="Например, подготовить автотесты"
                       maxlength="100">
                <small id="title-error" class="field-error"></small>
            </div>

            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description"
                          rows="4"
                          maxlength="1000"
                          placeholder="Опишите, что необходимо сделать"></textarea>
                <small id="description-error" class="field-error"></small>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="status">Статус</label>
                    <select id="status">
                        <option value="TODO">К выполнению</option>
                        <option value="IN_PROGRESS">В работе</option>
                        <option value="DONE">Выполнено</option>
                    </select>
                    <small id="status-error" class="field-error"></small>
                </div>

                <div class="form-group">
                    <label for="priority">Приоритет</label>
                    <select id="priority">
                        <option value="LOW">Низкий</option>
                        <option value="MEDIUM">Средний</option>
                        <option value="HIGH">Высокий</option>
                    </select>
                    <small id="priority-error" class="field-error"></small>
                </div>

            </div>

            <div class="form-group">
                <label for="deadline">Срок выполнения</label>
                <input id="deadline" type="date">
                <small id="deadline-error" class="field-error"></small>
            </div>

            <div class="task-form-actions">
                <a th:href="@{/tasks}" class="btn btn-secondary">
                    Отмена
                </a>

                <button id="create-task-button"
                        type="submit"
                        class="btn btn-primary">
                    Создать задачу
                </button>
            </div>

        </form>

    </section>

</main>

<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/validation.js}"></script>
<script th:src="@{/js/task-form.js}"></script>

</body>
</html>
